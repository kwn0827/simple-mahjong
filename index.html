<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>世界一やさしい麻雀教室</title>
    <style>
        body { background: #225522; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .game-container { max-width: 900px; margin: auto; padding: 20px; }
        .player-area { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; margin-top: 150px; }
        .npc-area { display: flex; justify-content: space-around; font-size: 0.8rem; color: #ccc; }
        .hand { display: flex; justify-content: center; gap: 4px; min-height: 80px; }
        .tile {
            width: 45px; height: 65px; background: #fdfdfd; color: black;
            border-radius: 4px; font-size: 40px; line-height: 65px;
            cursor: pointer; box-shadow: 2px 2px 0 #888; transition: 0.1s;
        }
        .tile:hover { transform: translateY(-10px); }
        .tsumo-area { margin-left: 20px; border-left: 2px darkgreen; }
        .guide { background: #fff; color: #333; padding: 10px; border-radius: 5px; margin: 15px 0; font-weight: bold; }
        .river { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; width: 120px; margin: auto; height: 100px; overflow: hidden; opacity: 0.6; }
        button { padding: 12px 24px; font-size: 18px; background: #ff9800; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="npc-area">
        <div>左の敵<div id="river1" class="river"></div></div>
        <div>上の敵<div id="river2" class="river"></div></div>
        <div>右の敵<div id="river3" class="river"></div></div>
    </div>

    <div class="player-area">
        <div id="guide" class="guide">同じのを3枚組、または123などの数字順を3枚組にしましょう！</div>
        <div id="my-hand" class="hand"></div>
        <div id="status" style="margin-top:20px; font-size: 1.2rem;"></div>
        <br>
        <button onclick="initGame()">新しく始める</button>
    </div>
</div>

<script>
    // 牌の種類定義
    const TILE_CHARS = [
        "🀇","🀈","🀉","🀊","🀋","🀌","🀍","🀎","🀏", // 萬子 1-9
        "🀙","🀚","🀛","🀜","🀝","🀞","🀟","🀠","🀡", // 筒子 1-9
        "🀐","🀑","🀒","🀓","🀔","🀕","🀖","🀗","🀘", // 索子 1-9
        "🀀","🀁","🀂","🀃","🀄","🀅","🀆"          // 字牌
    ];

    let deck = [];
    let myHand = [];
    let tsumoTile = null;

    function initGame() {
        deck = [];
        TILE_CHARS.forEach(char => { for(let i=0; i<4; i++) deck.push(char); });
        shuffle(deck);
        
        myHand = deck.splice(0, 13);
        myHand.sort();
        nextTurn();
    }

    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
    }

    function nextTurn() {
        // NPC3人が一瞬で牌を引いて捨てる（演出）
        for(let i=1; i<=3; i++) {
            let d = deck.pop();
            const river = document.getElementById(`river${i}`);
            const span = document.createElement('span');
            span.innerText = d;
            river.appendChild(span);
        }

        tsumoTile = deck.pop();
        render();
        updateGuide();
    }

    function discard(index) {
        if(index === -1) { 
            // ツモ切り
        } else {
            myHand.push(tsumoTile);
            myHand.splice(index, 1);
            myHand.sort();
        }
        tsumoTile = null;
        nextTurn();
    }

    function updateGuide() {
        // 本来は複雑な判定ですが、初心者のために「牌の種類数」で簡易的にアドバイス
        const uniqueTiles = new Set([...myHand, tsumoTile]).size;
        let msg = "いい感じ！同じ絵柄か、連続した数字を3つ集めて！";
        if(uniqueTiles < 7) msg = "あと少しで揃いそう！同じ牌を大事に持って！";
        document.getElementById('guide').innerText = msg;
    }

    function render() {
        const handDiv = document.getElementById('my-hand');
        handDiv.innerHTML = '';

        myHand.forEach((tile, i) => {
            const el = document.createElement('div');
            el.className = 'tile';
            el.innerText = tile;
            el.onclick = () => discard(i);
            handDiv.appendChild(el);
        });

        if (tsumoTile) {
            const el = document.createElement('div');
            el.className = 'tile tsumo-area';
            el.innerText = tsumoTile;
            el.onclick = () => discard(-1);
            handDiv.appendChild(el);
        }
    }

    initGame();
</script>
</body>
</html>
